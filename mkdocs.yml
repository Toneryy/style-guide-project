site_name: Руководство по стилю документации Itmotify
site_description: Правила написания и оформления документации музыкального сервиса Itmotify
site_author: Мещеряков Д.П., Катков А.С.
site_url: https://toneryy.github.io/style-guide-project/
repo_url: https://github.com/Toneryy/style-guide-project
repo_name: Toneryy/style-guide-project
edit_uri: edit/main/docs/
copyright: Мещеряков Д.П., Катков А.С. — Университет ИТМО, 2026

theme:
  name: material
  language: ru
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.highlight
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-night
        name: Включить тёмную тему
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: pink
      toggle:
        icon: material/weather-sunny
        name: Включить светлую тему

plugins:
  - search:
      lang: ru

markdown_extensions:
  - toc:
      permalink: true
      slugify: !!python/object/apply:pymdownx.slugs.slugify
        kwds:
          case: lower
  - tables
  - attr_list
  - pymdownx.tilde
  - pymdownx.keys
  - pymdownx.superfences
  - pymdownx.tasklist:
      custom_checkbox: true

# По умолчанию MkDocs пропускает папку templates/ — нам она нужна.
exclude_docs: |
  !/templates/

validation:
  nav:
    omitted_files: warn
    not_found: warn
  links:
    not_found: warn
    anchors: warn

nav:
  - Главная: index.md
  - Основы:
      - Общие принципы: principles.md
      - Стиль изложения: style.md
  - Язык и оформление:
      - Орфография и пунктуация: spelling.md
      - Числа, даты и единицы: numbers.md
      - Оформление текста: formatting.md
      - Правила Markdown: markdown.md
  - Точечные рекомендации:
      - Интерфейс и действия: ui.md
      - Требования и ТЗ: requirements.md
  - Шаблоны:
      - templates/index.md
      - Справочная статья: templates/help-article.md
      - Требование: templates/requirement.md
      - Заметки о выпуске: templates/release-notes.md
      - README: templates/readme.md
      - Описание метода API: templates/api-method.md
  - Примеры документов:
      - samples/index.md
      - Справочная статья: examples/create-playlist.md
      - Ответы на частые вопросы: samples/faq-premium.md
      - Требования к функциям: samples/requirements-playlists.md
      - README сервиса: samples/readme-api.md
      - Описание метода API: samples/api-create-playlist.md
      - Заметки о выпуске: samples/release-notes-1-4.md
  - Глоссарий: glossary.md
  - Проверка руководства:
      - examples/index.md
      - "Требования ТЗ: до и после": examples/nfr-rewrite.md
