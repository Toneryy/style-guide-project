# Раздел «Доступность текста» → «Ссылки»
# Проверяет исходную разметку (scope: raw), поэтому зачёркивание и комментарии vale его не отключают.
extends: existence
message: "Текст ссылки «%s» непонятен без окружения. Напишите, куда ведёт ссылка."
link: https://toneryy.github.io/style-guide-project/accessibility/#ссылки
level: error
scope: raw
ignorecase: true
nonword: true
tokens:
  # (?<![!`]) — не картинка и не инлайн-код; [\s*_.,:;…]* — пробелы, выделение и знаки внутри скобок
  - '(?<![!`])\[[\s*_]*(?:здесь|тут|сюда|по (?:этой )?ссылке|ссылк[аеуи]|подробнее|читать далее|далее)[\s*_.,:;…]*\]\('
