# Раздел «Орфография и пунктуация» → «Буква «ё»»
extends: substitution
message: "Пишите «ё»: «%s» вместо «%s»."
link: https://toneryy.github.io/style-guide-project/spelling/#буква-ё
level: error
ignorecase: true
swap:
  'еще': ещё
  'ее': её
  'отчет(?:а|у|ом|е|ы|ов|ам|ами|ах)?': отчёт
  'сч[е]т(?:а|у|ом|е)?': счёт
  'объем(?:а|у|ом|е|ы)?': объём
  'учет(?:а|у|ом|е)?': учёт
  'прием(?:а|у|ом|е)?': приём
  'платежн(?:ый|ая|ое|ые|ого|ой|ом|ых|ую)': платёжный
  'темн(?:ый|ая|ое|ые|ую|ой|ом)': тёмный
  'черн(?:ый|ая|ое|ые|ую|ой|ом)': чёрный
  'зеленн?(?:ый|ая|ое|ые|ую|ой|ом)': зелёный
  'вперед': вперёд
  'нажмете': нажмёте
  'найдете': найдёте
