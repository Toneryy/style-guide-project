# Разделы «Стиль изложения» → «Оценочные и пустые слова» и «Требования и ТЗ» → «Проверяемость»
extends: existence
message: "Неточная формулировка «%s»: замените конкретикой – числом, названием или условием."
link: https://toneryy.github.io/style-guide-project/requirements/#проверяемость
level: warning
ignorecase: true
tokens:
  # «Быстрый старт» – устойчивое название раздела README, не оценка
  - 'быстр(?:о|ый|ая|ое|ые|ее)(?! старт)'
  - 'удобн(?:о|ый|ая|ое|ые|ым|ыми|ого)'
  - 'понятн(?:о|ый|ая|ое|ые|ым)'
  - 'интуитивн(?:о|ый|ая|ое|ые)'
  - 'легко'
  - 'просто'
  - 'всего лишь'
  - 'несколько'
  - 'оптимальн\p{L}*'
  - 'корректн\p{L}*'
  - 'максимально'
  - 'минимальн\p{L}* количеств\p{L}*'
  - 'больш\p{L}* количеств\p{L}*'
  - 'высок(?:ой|ая|ий) нагрузк\p{L}*'
  - 'без заметных задержек'
  - 'отзывчив\p{L}*'
  - 'безопасн(?:ым|ый|ая|ое|ого) способ\p{L}*'
  - 'долж(?:ен|на|но|ны) быть (?:защищен|ограничен)\p{L}*'
  - 'по возможности'
  - 'при необходимости'
  - 'желательно'
  - 'в перспективе'
  - 'и т\. ?д\.'
  - 'и т\. ?п\.'
