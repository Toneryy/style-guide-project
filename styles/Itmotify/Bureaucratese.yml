# Раздел «Стиль изложения» → «Канцелярит»
extends: substitution
message: "Канцелярит: попробуйте «%s» вместо «%s»."
link: https://toneryy.github.io/style-guide-project/style/#канцелярит
level: warning
ignorecase: true
swap:
  'данн(?:ый|ая|ое|ого|ой|ому|ом|ую)': этот
  'осуществл(?:ять|яет|яют|ялся|яется|яются|ение|ения|ено|ена|ен)': делать, выполнять
  'производ(?:ить|ит|ят|ится|ятся)': конкретный глагол
  'явля(?:ется|ются|лся|лась|лось|лись)': тире или «это»
  'в целях': чтобы, для
  'в связи с тем,? что': потому что
  'в случае,? если': если
  'посредством': с помощью
  'име(?:ет|ют) возможность': может, могут
  'на сегодняшний день': сейчас
  'в рамках': в, во время
