# Настройки Vale — проверка языка и стиля по руководству Itmotify.
# Правила лежат в styles/Itmotify, каждое правило ссылается на раздел руководства.
StylesPath = styles
MinAlertLevel = suggestion

# Код и зачёркнутые примеры «как неправильно» не проверяем.
IgnoredScopes = code, tt, del, s

[*.md]
BasedOnStyles = Itmotify
